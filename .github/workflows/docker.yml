name: Build and Push Docker Image

on:
  push:
    branches:
      - week_6

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: project-393be603-6b75-4435-8cb

    - name: Configure Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build Docker Image
      run: |
        docker build -t us-central1-docker.pkg.dev/project-393be603-6b75-4435-8cb/iris-repo/iris-api:latest .

    - name: Push Docker Image
      run: |
        docker push us-central1-docker.pkg.dev/project-393be603-6b75-4435-8cb/iris-repo/iris-api:latest
